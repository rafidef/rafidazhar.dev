<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      GitHub Pages cannot serve a real 301 for a user site: no header control,
      no status code control. A same page instant meta refresh plus a canonical
      link is the strongest permanent redirect signal this host can produce.
      Google consolidates on it; other crawlers honour it less consistently.

      Replace BOTH occurrences of the target origin below if the domain
      changes again.
    -->
    <link rel="canonical" href="https://rafidazhar.dev/" />
    <meta http-equiv="refresh" content="0; url=https://rafidazhar.dev/" />

    <!--
      There is deliberately NO "noindex" here, and it must not be added back.

      This page's whole job is to hand the old origin's accumulated ranking
      signals to the new one. rel=canonical is the instruction that does that:
      consolidate everything you know about this URL into the target.

      noindex is the opposite instruction. It says drop this page, transfer
      nothing. Worse, Google warns against pairing it with rel=canonical at
      all, because canonical consolidates signals into the target and noindex
      is one of the signals that can travel with them. The bad outcome is
      rafidazhar.dev inheriting the noindex.

      The old URL still leaves the index on its own: the instant meta refresh
      reads as a move, and the canonical points the authority at the new home.
      That is the natural decay a 301 would have produced, which is what we
      want here.
    -->

    <!--
      DO NOT REMOVE. This is the Search Console verification token for the
      rafidef.github.io property, carried over from the old index.html.

      The Change of Address tool requires the OLD property to still be
      verified at the moment it runs, and this file is the only page left on
      that origin. Dropping the tag unverifies the property and silently
      removes the strongest migration signal available.

      Safe to delete only once Change of Address has completed and the new
      property is receiving the old property's traffic in the reports.
    -->
    <meta
      name="google-site-verification"
      content="0MudRj_z9f_mtfs4zYi1URaJO2dgxhcdUNlYPEmAedg"
    />

    <title>Rafid Azhar | DevOps &amp; Cloud Engineer</title>

    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font: 400 16px/1.6 ui-sans-serif, system-ui, sans-serif;
        background: #ebeeec;
        color: #101416;
        text-align: center;
      }
      a { color: inherit; font-weight: 600; }
      .mark { font-family: ui-monospace, monospace; color: #4e5a56; }
      .dot { color: #4a6104; }
      @media (prefers-color-scheme: dark) {
        body { background: #101416; color: #e8ecea; }
        .mark { color: #93a19f; }
        .dot { color: #c3ec3f; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">&lt;rafidazhar<span class="dot">.</span>dev/&gt;</p>
      <p>This site has moved to <a href="https://rafidazhar.dev/">rafidazhar.dev</a>.</p>
    </main>

    <!-- Belt and braces for clients that ignore the meta refresh. -->
    <script>
      location.replace("https://rafidazhar.dev/");
    </script>
  </body>
</html>
