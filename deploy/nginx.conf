# nginx reverse proxy for the Next.js standalone server.
#
# Install to /etc/nginx/sites-available/rafidazhar and symlink into
# sites-enabled.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE IS HTTP ONLY, DELIBERATELY.
#
# No TLS directives, no certificate paths, no HTTPS redirect. Per the brief, I
# do not write TLS config. Run the certbot command in deploy/README.md step 7
# and certbot will insert the TLS server block, the certificate paths and the
# port 80 redirect into this file itself. Do not hand-write them.
#
# Until then this serves plain HTTP, which is correct for validating the
# deployment before a certificate exists.
# ─────────────────────────────────────────────────────────────────────────────

upstream rafidazhar_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with the real hostname at deploy time. Kept as a placeholder so
    # no origin is baked into the repository.
    server_name REPLACE_WITH_HOSTNAME;

    # Next.js already gzips nothing; let nginx handle it.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    client_max_body_size 2m;

    # Immutable build output. Hashed filenames, safe to cache forever.
    location /_next/static/ {
        proxy_pass http://rafidazhar_app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Optimised images. Long cache, but not immutable: the source can change.
    location /_next/image {
        proxy_pass http://rafidazhar_app;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://rafidazhar_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    access_log /var/log/nginx/rafidazhar.access.log;
    error_log  /var/log/nginx/rafidazhar.error.log;
}
